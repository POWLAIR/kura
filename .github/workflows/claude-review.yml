name: Claude review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Relis cette PR en français, en t'appuyant sur CLAUDE.md et docs/conception.md.
            Priorité aux bugs et aux règles non négociables : RLS sur chaque table utilisateur,
            aucune donnée de santé dans les logs, aucune valeur nutritionnelle estimée par LLM,
            idempotence des tools log_*, atomicité de cook_recipe, ton du compagnon.
            Commentaires inline pour les problèmes précis, un commentaire de synthèse court.
            Ne signale pas le style : Biome s'en charge.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
