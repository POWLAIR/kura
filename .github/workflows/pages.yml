name: PWA

# Build web de l'app, publié sur GitHub Pages (https://powlair.github.io/kura/) à chaque
# push sur main qui touche l'app. Voir docs/app.md, « Version web (PWA) ».
on:
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - packages/core/**
      - pnpm-lock.yaml
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # URL et clé publique du projet Supabase : variables du dépôt (publiques par nature,
      # embarquées dans l'app). Jamais la clé secrète ni service_role.
      - name: Variables de l'app
        run: |
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || { echo "Variable EXPO_PUBLIC_SUPABASE_URL manquante"; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_KEY" || { echo "Variable EXPO_PUBLIC_SUPABASE_KEY manquante"; exit 1; }
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_KEY }}
      - run: pnpm --filter @kura/mobile export:web
        env:
          KURA_WEB_BASE_URL: /kura
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_KEY }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
