name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Les jobs suivants ne font rien tant que le dossier concerné est vide.
  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        if: hashFiles('supabase/functions/**/*.ts') != ''
        with:
          deno-version: v2.x
      - if: hashFiles('supabase/functions/**/*.ts') != ''
        run: deno check supabase/functions/**/*.ts

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: migrations
        run: echo "present=${{ hashFiles('supabase/migrations/*.sql') != '' }}" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@v3
        if: steps.migrations.outputs.present == 'true'
        with:
          version: latest
      - if: steps.migrations.outputs.present == 'true'
        run: supabase db start
      - if: steps.migrations.outputs.present == 'true'
        run: supabase db lint --fail-on error
      - if: steps.migrations.outputs.present == 'true'
        run: supabase test db
